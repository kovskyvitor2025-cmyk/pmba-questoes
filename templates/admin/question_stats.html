{% extends 'base.html' %}{% block content %}<div class="admin-head"><div><span class="tag">QUESTÃO #{{q.id}}</span><h1>Estatísticas da questão</h1><p class="muted">{{q.categoria}} • {{q.disciplina}} • {{q.banca}} • {{q.ano}}</p></div><a class="button secondary" href="{{url_for('admin_questions')}}">Voltar</a></div><div class="grid3"><div class="stat"><b>{{total}}</b><span>Respostas</span></div><div class="stat"><b>{{correct}}</b><span>Acertos</span></div><div class="stat"><b>{{percent}}%</b><span>Taxa de acerto</span></div></div><div class="card"><h2>Enunciado</h2><p>{{q.enunciado}}</p><p><b>Gabarito:</b> {{q.gabarito}}</p></div>{% endblock %}
