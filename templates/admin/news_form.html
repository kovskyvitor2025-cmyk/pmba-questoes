{% extends 'base.html' %}{% block content %}<div class="admin-head"><div><span class="tag">ADMIN</span><h1>Nova notícia</h1></div></div><div class="card"><form method="post"><label>Título<input name="titulo" value="{{item.titulo if item else ''}}" required></label><label>Resumo<textarea name="resumo" rows="5">{{item.resumo if item else ''}}</textarea></label><label>Link da notícia<input type="url" name="url" value="{{item.url if item else ''}}"></label><label><input type="checkbox" name="publicada" checked> Publicar agora</label><label><input type="checkbox" name="enviar_whatsapp"> Enviar para usuários que autorizaram notícias</label><button>Salvar notícia</button></form></div>{% endblock %}
