{% extends 'base.html' %}
{% block content %}<div class="page-head"><div><span class="tag">COMUNICAÇÃO</span><h1>WhatsApp e notificações</h1><p>Escolha quais mensagens você deseja receber.</p></div></div><div class="card" style="max-width:720px"><form method="post"><label>Número de WhatsApp<input name="telefone" value="{{user.telefone}}" required placeholder="5575999999999"></label><label><input type="checkbox" name="whatsapp_confirmado" {% if user.whatsapp_confirmado %}checked{% endif %}> Confirmo que este número é meu WhatsApp e autorizo o envio.</label><hr><label><input type="checkbox" name="receber_questoes" {% if user.receber_questoes %}checked{% endif %}> Receber questões e lembretes de estudo</label><label><input type="checkbox" name="receber_desempenho" {% if user.receber_desempenho %}checked{% endif %}> Receber alertas sobre meu desempenho</label><label><input type="checkbox" name="receber_noticias" {% if user.receber_noticias %}checked{% endif %}> Receber notícias e atualizações do concurso</label><button>Salvar preferências</button></form><p class="muted" style="margin-top:15px">O envio automático depende da configuração da WhatsApp Business Cloud API e das regras de templates da Meta.</p></div>{% endblock %}
