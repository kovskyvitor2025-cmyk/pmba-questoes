{% extends 'base.html' %}{% block content %}<div class="auth"><div class="card"><h1>Criar conta</h1><p class="muted">Cadastre seus dados para acompanhar seu progresso.</p><form method="post"><label>Usuário<input name="username" required minlength="3" autocomplete="username"></label><label>E-mail<input type="email" name="email" required autocomplete="email"></label><label>Número de telefone<input type="tel" name="telefone" required placeholder="(75) 99999-9999"></label><label>Senha<input type="password" name="password" required minlength="6" autocomplete="new-password"></label><label><input type="checkbox" name="whatsapp_confirmado"> Quero receber questões, alertas e notícias no WhatsApp informado.</label><button>Cadastrar</button></form><p>Já possui conta? <a href="{{url_for('login')}}">Entrar</a></p></div></div>{% endblock %}
